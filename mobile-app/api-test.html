<!DOCTYPE html>
<html>
<head>
    <title>API Connectivity Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { margin: 10px 0; padding: 10px; }
    </style>
</head>
<body>
    <h1>Trading App Mobile - API Connectivity Test</h1>
    
    <div id="results"></div>
    
    <button onclick="testConnection()">Test API Connection</button>
    <button onclick="testLogin()">Test Login</button>
    
    <script>
        const API_BASE = 'http://localhost:3000/api';
        
        function log(message, isError = false) {
            console.log(message);
            const div = document.createElement('div');
            div.className = `test ${isError ? 'error' : 'success'}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testConnection() {
            try {
                log('Testing connection to ' + API_BASE + '/test');
                
                const response = await fetch(API_BASE + '/test', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('✅ Connection test successful: ' + JSON.stringify(data));
                } else {
                    log('❌ Connection test failed: ' + response.status + ' ' + response.statusText, true);
                }
            } catch (error) {
                log('❌ Connection test error: ' + error.message, true);
            }
        }
        
        async function testLogin() {
            try {
                log('Testing login to ' + API_BASE + '/mobile/auth/login');
                
                const response = await fetch(API_BASE + '/mobile/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'Bina',
                        password: 'test'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('✅ Login test successful: ' + JSON.stringify(data));
                } else {
                    const errorData = await response.text();
                    log('❌ Login test failed: ' + response.status + ' ' + response.statusText + ' - ' + errorData, true);
                }
            } catch (error) {
                log('❌ Login test error: ' + error.message, true);
            }
        }
        
        // Run connection test automatically
        window.onload = () => {
            log('Starting automatic API connectivity test...');
            testConnection();
        };
    </script>
</body>
</html>

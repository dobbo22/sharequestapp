<!DOCTYPE html>
<html>
<head>
    <title>Mobile App Functionality Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Mobile Trading App - Offline Mode Test</h1>
    <p>Testing the mobile app functionality with forced offline mode to bypass CORS issues</p>
    
    <button onclick="testMobileApp()">Test Mobile App Direct Access</button>
    <button onclick="testApiConnectivity()">Test API Connectivity</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>
    
    <h2>Mobile App Preview</h2>
    <iframe src="http://localhost:8081" id="mobileFrame"></iframe>
    
    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
            console.log(message);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testMobileApp() {
            log('🧪 Testing mobile app direct access...');
            try {
                const response = await fetch('http://localhost:8081', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    log('✅ Mobile app is accessible via direct URL!', 'success');
                    log('📱 The app should be loaded in the iframe below', 'info');
                } else {
                    log(`❌ Mobile app access failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Mobile app access error: ${error.message}`, 'error');
            }
        }
        
        async function testApiConnectivity() {
            log('🔌 Testing API connectivity (should fail due to CORS)...');
            try {
                // This should fail and trigger offline mode
                const response = await fetch('http://localhost:3000/api/test', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    log('⚠️ Unexpected: API call succeeded - CORS may be resolved', 'info');
                } else {
                    log(`❌ API call failed as expected: ${response.status} ${response.statusText}`, 'info');
                }
            } catch (error) {
                log(`✅ CORS blocking confirmed: ${error.message}`, 'success');
                log('📝 This confirms the mobile app should use offline mode', 'info');
            }
        }
        
        // Auto-test on load
        window.onload = () => {
            log('🚀 Starting automatic tests...');
            setTimeout(() => {
                testMobileApp();
                setTimeout(testApiConnectivity, 2000);
            }, 1000);
        };
        
        // Listen for iframe messages (if mobile app sends any)
        window.addEventListener('message', (event) => {
            if (event.origin === 'http://localhost:8081') {
                log(`📨 Message from mobile app: ${JSON.stringify(event.data)}`, 'info');
            }
        });
        
        // Show test status
        log('📍 Test page loaded - Mobile app should appear in iframe below');
        log('🎯 If offline mode is working, you should be able to interact with the mobile app');
    </script>
</body>
</html>

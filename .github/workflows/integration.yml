name: Integration Tests

on:
  workflow_dispatch: {}

jobs:
  integration-test:
    name: Run integration tests against staging
    runs-on: ubuntu-latest
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      TEST_API_TOKEN: ${{ secrets.TEST_API_TOKEN }}
      TOKEN_HMAC_SECRET: ${{ secrets.TOKEN_HMAC_SECRET }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd vercel
          npm ci

      - name: Run integration test
        # The integration-test script accepts an optional host argument; we pass STAGING_BASE_URL
        run: |
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "Error: STAGING_BASE_URL secret is not set. Add it in Settings → Secrets.\nThis should be the base URL for your staging deployment (e.g. https://staging.example.com)";
            exit 1;
          fi
          cd vercel
          # Ensure TEST_API_TOKEN is provided
          if [ -z "$TEST_API_TOKEN" ]; then
            echo "Error: TEST_API_TOKEN secret is not set. Create a dedicated token for CI and add it as a secret.";
            exit 1;
          fi
          node scripts/integration-test.mjs "$STAGING_BASE_URL"
